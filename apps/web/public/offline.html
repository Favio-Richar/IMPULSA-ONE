<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; background: #ffffff; text-align: center; }
      main { max-width: 26rem; }
      h1 { font-size: 1.375rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.25rem; line-height: 1.5; color: #374151; }
      button { min-height: 44px; padding: 0 1.25rem; border: 0; border-radius: 8px; background: #0f766e; color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #0f766e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No pudimos conectarnos a internet. Tu información está a salvo; revisa tu conexión y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
