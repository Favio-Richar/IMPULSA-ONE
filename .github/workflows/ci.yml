name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "12.4.1"
  NODE_VERSION: "24"

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # --frozen-lockfile: instalación reproducible, falla si el lockfile no coincide con
      # los package.json (evita que CI "arregle" silenciosamente dependencias desalineadas).
      - name: Install dependencies (reproducible)
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Tests
    needs: install
    runs-on: ubuntu-latest
    # apps/api tiene pruebas de integración reales contra Postgres/Redis (no mocks) — F1.4/F1.9
    # exigen exactamente esto para validar aislamiento y flujos de auth de verdad.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: impulza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d impulza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/impulza
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      APP_BASE_URL: http://localhost:3100
      # Requeridas por apps/api desde F3.4 (sal del visitante anonimizado) y F3.6 (secreto del
      # proxy apps/web -> apps/api). Faltaban acá: el job no podía arrancar la API en las pruebas.
      ANALYTICS_SALT_SECRET: ci-test-placeholder-analytics-salt-not-real
      INTERNAL_PROXY_SECRET: ci-test-placeholder-proxy-secret-not-real-value
      # apps/web valida su entorno al importar `lib/env.ts` (mismo no negociable que apps/api) —
      # algunas de sus pruebas lo importan transitivamente (rutas de F2.7/F2.8), así que este job
      # también necesita valores, aunque ninguno apunte a un servicio real.
      API_BASE_URL: http://localhost:4000/api/v1
      REVALIDATE_SECRET: ci-test-placeholder-secret-not-a-real-value
      PUBLIC_WEB_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm --filter @impulza/database run db:migrate:deploy
      - name: Seed roles and permissions
        run: pnpm --filter @impulza/database run db:seed
      - run: pnpm test

  e2e:
    name: E2E (navegador real)
    needs: install
    runs-on: ubuntu-latest
    # ADR-003: estas pruebas corren contra la API real y un navegador real porque miden lo que
    # ninguna otra capa ve — geometría del layout en un viewport angosto de verdad. Van aparte de
    # `pnpm test` justamente porque necesitan todo esto levantado.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: impulza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d impulza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://ci:ci@localhost:5432/impulza
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000,http://localhost:3100
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      APP_BASE_URL: http://localhost:3100
      ANALYTICS_SALT_SECRET: ci-test-placeholder-analytics-salt-not-real
      INTERNAL_PROXY_SECRET: ci-test-placeholder-proxy-secret-not-real-value
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WEB_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm --filter @impulza/database run db:migrate:deploy
      - name: Seed roles and permissions
        run: pnpm --filter @impulza/database run db:seed
      # Solo Chromium: lo que se mide es la geometría del layout, no la compatibilidad entre
      # navegadores (ADR-003).
      - name: Install Playwright browser
        run: pnpm --filter @impulza/e2e exec playwright install --with-deps chromium
      # Playwright levanta la API y el dashboard por su cuenta (`webServer`) y espera a que
      # respondan antes de empezar.
      - run: pnpm test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    # `next build` evalúa el schema de entorno de cada app Next.js al prerenderizar (no negociable
    # "validadas al iniciar", CLAUDE.md) aunque la página en sí no llame a la API en build time —
    # sin esto el job queda roto igual que estuvo desde F1.8 (dashboard) hasta que F2.7 lo notó al
    # agregar apps/web con la misma validación. Valores de relleno a propósito: este job solo
    # verifica que el build compile, nunca despliega ni necesita una API real detrás.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      API_BASE_URL: http://localhost:4000/api/v1
      REVALIDATE_SECRET: ci-build-placeholder-secret-not-a-real-value
      PUBLIC_WEB_BASE_URL: http://localhost:3000
      # Faltaba desde F3.5 (el panel la valida al compilar) y F3.6 (apps/web).
      NEXT_PUBLIC_WEB_BASE_URL: http://localhost:3000
      INTERNAL_PROXY_SECRET: ci-build-placeholder-proxy-secret-not-real-value
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    name: Dependency audit
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit

  # Puerta única para branch protection: un solo required check en vez de listar cada job.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, typecheck, test, e2e, build, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Al menos un job falló."
            exit 1
          fi
