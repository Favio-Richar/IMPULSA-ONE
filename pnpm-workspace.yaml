packages:
  - "apps/*"
  - "packages/*"
overrides:
  # GHSA-ggr8-5vv4-36mx: stack exhaustion (DoS) en deepmerge-ts <8.0.0, dependencia transitiva
  # de @prisma/config (vía prisma/@prisma/client). Forzado a la versión parchada.
  "deepmerge-ts@<8.0.0": ">=8.0.2"
allowBuilds:
  # @prisma/client / @prisma/engines / prisma: generan el cliente y descargan el binario del
  # query engine oficial de Prisma — necesario para que el ORM funcione, paquete del fabricante.
  '@prisma/client': true
  # @prisma/engines / prisma: descargan el binario del query engine oficial de Prisma —
  # necesario para que el ORM funcione, paquete propio del fabricante (no un tercero).
  '@prisma/engines': true
  # @scarf/scarf: dependencia transitiva de @nestjs/swagger. Su script de instalación existe solo
  # para enviar telemetría de uso a un tercero. No aporta nada al funcionamiento del paquete y sale
  # datos del entorno de build, así que queda bloqueado explícitamente.
  '@scarf/scarf': false
  # argon2: hashing de contraseñas (OWASP recomienda Argon2id sobre bcrypt). Necesita compilar/
  # descargar su binario nativo para funcionar.
  argon2: true
  # esbuild: binario nativo requerido por tsx (dev runner de apps/api y apps/worker). Paquete
  # ampliamente usado y auditado; se aprueba explícitamente en vez de bloquear el script.
  esbuild: true
  # msgpackr-extract: acelerador nativo opcional de msgpackr (dependencia de bullmq, F3.6). No se
  # aprueba: msgpackr funciona igual con su implementación en JS puro, y así no se ejecuta un script
  # de instalación de terceros que no hace falta.
  msgpackr-extract: false
  prisma: true
  # unrs-resolver: resolutor nativo usado transitivamente por el tooling de ESLint/Next.js.
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@12.0.2'
  - '@nestjs/core@12.0.2'
  - '@nestjs/platform-express@12.0.2'
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13
  - lucide-react@1.46.0
  - '@nestjs/testing@12.0.2'
  - '@aws-sdk/client-s3@3.1140.0'
  - '@aws-sdk/s3-request-presigner@3.1140.0'
